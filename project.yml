name: SimpleEQ
options:
  bundleIdPrefix: app.simpleeq
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  SimpleEQ:
    type: application
    platform: macOS
    sources:
      - path: SimpleEQ
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.simpleeq.SimpleEQ
        PRODUCT_NAME: SimpleEQ
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SimpleEQ/Info.plist
        CODE_SIGN_ENTITLEMENTS: SimpleEQ/SimpleEQ.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
schemes:
  SimpleEQ:
    build:
      targets:
        SimpleEQ: all
    run:
      config: Debug
